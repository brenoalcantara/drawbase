name: Feature request
description: Propose an improvement or a new capability for DrawBase.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this change address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like and how it fits DrawBase.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other designs you considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Visual editor
        - SQL generation
        - Database introspection
        - Project persistence
        - Import or export
        - API
        - Docker or operations
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched for an existing issue or roadmap item covering this request.
          required: true
        - label: This request does not include credentials or private database information.
          required: true
