name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve DrawBase. Remove credentials, connection strings, schema data and other sensitive information before submitting.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start DrawBase with ...
        2. Open ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: database
    attributes:
      label: Database
      description: Select the database involved, if any.
      options:
        - Not applicable
        - PostgreSQL
        - MySQL
        - SQLite
        - Multiple databases
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the DrawBase version or commit, browser, operating system and whether Docker is being used.
      placeholder: |
        DrawBase commit:
        Browser:
        Operating system:
        Docker / manual setup:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste only sanitized logs or attach screenshots. Do not include secrets or private schema data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checklist
      options:
        - label: I searched for an existing issue describing this problem.
          required: true
        - label: I removed credentials, connection strings and sensitive schema data.
          required: true
        - label: This is not a security vulnerability. Security reports follow SECURITY.md.
          required: true
