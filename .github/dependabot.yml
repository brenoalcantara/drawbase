version: 2

updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      api-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    groups:
      app-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Sao_Paulo
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:45"
      timezone: America/Sao_Paulo
    groups:
      compose-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /api
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Sao_Paulo
    groups:
      api-container-images:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: America/Sao_Paulo
    groups:
      app-container-images:
        patterns:
          - "*"
