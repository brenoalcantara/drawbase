name: ${COMPOSE_PROJECT_NAME:-drawbase}

services:
  app:
    build:
      context: ./app
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      api:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      DRAWBASE_API_PROXY_TARGET: http://api:3001
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-5173}:5173"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./app:/workspace
      - app_node_modules:/workspace/node_modules

  api:
    build:
      context: ./api
      target: dev
    command: npm run dev
    environment:
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
      HOST: 0.0.0.0
      INTROSPECTION_ALLOWED_HOSTS: ${INTROSPECTION_ALLOWED_HOSTS:-}
      MYSQL_TEST_DATABASE: ${MYSQL_DATABASE:-drawbase_dev}
      MYSQL_TEST_HOST: mysql-test
      MYSQL_TEST_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_TEST_PORT: 3306
      MYSQL_TEST_USER: ${MYSQL_USER:-drawbase}
      NODE_ENV: development
      PORT: 3001
      POSTGRES_TEST_DATABASE: ${POSTGRES_DB:-drawbase_dev}
      POSTGRES_TEST_HOST: postgres-test
      POSTGRES_TEST_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_TEST_PORT: 5432
      POSTGRES_TEST_USER: ${POSTGRES_USER:-drawbase}
      PROJECTS_DATA_DIR: ${PROJECTS_DATA_DIR:-/data/projects}
      SQL_EXECUTION_ENABLED: ${SQL_EXECUTION_ENABLED:-false}
      SQL_EXECUTION_LOG_DIR: ${SQL_EXECUTION_LOG_DIR:-/data/projects}
      SQLITE_DATA_DIR: /data/sqlite
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./api:/workspace
      - api_node_modules:/workspace/node_modules
      - projects_data:${PROJECTS_DATA_DIR:-/data/projects}
      - sqlite_data:/data/sqlite

  postgres-test:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drawbase_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:-drawbase}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54320}:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data

  mysql-test:
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-drawbase_dev}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${MYSQL_USER:-drawbase}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 45s
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-33070}:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql

volumes:
  api_node_modules:
  app_node_modules:
  mysql_test_data:
  postgres_test_data:
  projects_data:
  sqlite_data:
